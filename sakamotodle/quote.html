<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakamotodle - Quotes Mode</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .mode-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .mode-tab { padding: 10px 20px; border-radius: 8px; text-decoration: none; color: white; background-color: #333; font-weight: bold; transition: 0.2s; }
        .mode-tab:hover { background-color: #555; }
        .mode-tab.active { background-color: #f44336; }
        .quote-container { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; font-size: 22px; font-style: italic; max-width: 600px; margin: 0 auto 30px; border-left: 5px solid #f44336; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .quote-container::before { content: '"'; font-size: 40px; color: #f44336; vertical-align: top; margin-right: 5px; }
        .quote-container::after { content: '"'; font-size: 40px; color: #f44336; vertical-align: bottom; margin-left: 5px; }
        .guess-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); margin-bottom: 10px; padding: 10px 20px; border-radius: 8px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .guess-row img { width: 50px; height: 50px; border-radius: 6px; object-fit: contain; background-color: #222; }
        .guess-name { font-size: 18px; font-weight: bold; flex-grow: 1; text-align: left; margin-left: 15px; }
        .guess-status { font-size: 24px; }
    </style>
</head>
<body>
    <div class="nav"><a href="../index.html">← Back to Meanidle</a></div>
    
    <div class="mode-tabs">
        <a href="index.html" class="mode-tab">Classic Mode</a>
        <a href="quote.html" class="mode-tab active">Quotes Mode</a>
    </div>

    <img src="../images/sakamoto_logo.png" alt="Sakamoto Days Logo" class="main-logo" style="transform: scale(0.75);">
    <div class="subtitle">Who said this quote?</div>

    <div class="quote-container" id="quoteDisplay">Loading quote...</div>

    <div class="controls">
        <div class="autocomplete" style="position: relative; display: inline-block;">
            <input type="text" id="guessInput" placeholder="Type a character name..." autocomplete="off">
            <div id="autocompleteList" class="autocomplete-items"></div>
        </div>
        
        <button id="guessBtn">Guess!</button>
        <button id="hintBtn" style="background-color: #ff9800;">Hint 💡</button>
        <button id="answerBtn">Answer 🔍</button>
        <button id="restartBtn">New Round 🔄</button>
    </div>

    <div id="hintBox" style="display: none; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin: 0 auto 20px; max-width: 500px; color: #ffeb3b; font-size: 18px;"></div>

    <div id="answerBox" class="answer-box" style="display:none"></div>
    <div class="stats">Guesses: <span id="guessCount">0</span></div>
    
    <div id="resultContainer" style="margin-top: 20px; padding-bottom: 40px;"></div>


    <footer style="margin-top: 40px; text-align: center; color: #888; font-size: 0.9rem; padding: 20px;">
        If you want to support, comment, or leave feedback, send it to <a href="mailto:karmaez3388@gmail.com" style="color: #ff6f00; text-decoration: none; font-weight: bold;">karmaez3388@gmail.com</a><br><br>
        &copy; 2026 Meanidle. Open-sourced under the <a href="https://github.com/NPCtest/Meanidle/blob/main/LICENSE" target="_blank" style="color: #888; text-decoration: underline;">GPLv3 License</a>.
    </footer>
    <script type="module" src="js/quotes/quoteMain.js"></script>
</body>
</html>
