<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haikyuudle - เกมทายตัวละคร</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="nav"><a href="../index.html">← Back to Meanidle</a></div>
    <img src="../images/haikyuu_logo.png" alt="Haikyuu Logo" class="main-logo">
    <div class="subtitle">Guess Haikyuu!! Characters!</div>

    <div class="controls">
        <div class="autocomplete" style="position: relative; display: inline-block;">
            <input type="text" id="guessInput" placeholder="Type a character name..." autocomplete="off">
            <div id="autocompleteList" class="autocomplete-items"></div>
        </div>
        
        <button id="guessBtn">Guess!</button>
        <button id="answerBtn">Answer 🔍</button>
        <button id="restartBtn">New Round 🔄</button>
    </div>

    <div id="answerBox" class="answer-box" style="display:none"></div>

    <div class="stats">Guesses: <span id="guessCount">0</span></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Team</th>
                    <th>Prefecture</th>
                    <th>Position</th>
                    <th>Year</th>
                    <th>Number</th>
                    <th>Height</th>
                    <th>Hair</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>


    <footer style="margin-top: 40px; text-align: center; color: #888; font-size: 0.9rem; padding: 20px;">
        If you want to support, comment, or leave feedback, send it to <a href="mailto:karmaez3388@gmail.com" style="color: #ff6f00; text-decoration: none; font-weight: bold;">karmaez3388@gmail.com</a><br><br>
        &copy; 2026 Meanidle. Open-sourced under the <a href="https://github.com/NPCtest/Meanidle/blob/main/LICENSE" target="_blank" style="color: #888; text-decoration: underline;">GPLv3 License</a>.
    </footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
